# Auto build & deploy the static site in ./site to GitHub Pages
name: Build & Deploy to GitHub Pages

on:
  # Run on pushes to the default branch that touch the site
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  # Manual trigger
  workflow_dispatch:
  # Let Pages deploy on demand
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deployment: ${{ steps.deployment.outputs.deployment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (static)
        # This project is pure static HTML/CSS/JS — the source in ./site
        # is already the final site, so "build" just copies it to the
        # Pages output dir. Swap in a real build step (npm run build,
        # hugo, etc.) if the site gains a build toolchain.
        run: cp -R ./site "$RUNNER_TEMP/site-out"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable the Pages site via the workflow's own job permissions
          # (pages: write + id-token: write) — the PAT has no Pages scope.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site-out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
